[package]
name = "mood-task-app"
version = "0.1.0"
description = "A desktop app for task and mood tracking"
authors = ["Your Name"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"  # 添加 opener 插件

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
