name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: 前端校验（类型 / 版本号 / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 版本号真源是 src-tauri/tauri.conf.json；不一致直接失败，避免打包出对不上的版本
      - name: 校验版本号一致性
        run: npm run version:check

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

      # 离线评测：跑生产同一套代码 + 脚本回放（不联网、不需要本地模型），
      # 断言产品级承诺：零降级基线、引用白名单拦住编造、模型挂掉仍能产出合法计划、工具确认能生效。
      # 说明：`npm test` 已包含评测用例（同样的断言），这一步额外把**指标报告**打进 CI 日志，
      # 便于对比"这次改动是不是让指标退化了"。
      - name: 离线评测（回放）
        run: npm run eval

      - name: 构建产物
        run: npm run build

# 说明：Rust 侧的 `cargo check` 没有放进 CI。
# 它需要 runner 预装 WebKitGTK 等系统级依赖，首次编译也偏慢，
# 与本仓库"快速、稳定"的 CI 定位冲突。请在本机（已具备工具链的环境）执行：
#   cd src-tauri && cargo check --message-format=short
