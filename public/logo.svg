<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="高山仰止">
  <defs>
    <!-- 纸面：主渐变（左上升起，右下收深），制造体积感 -->
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C7BFF" />
      <stop offset="52%" stop-color="#5B55EC" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- 折角：受光面。靠近折痕暗、自由角亮，强化"翻起来"的立体感 -->
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A9A7FF" />
      <stop offset="45%" stop-color="#D6D5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 折痕投影：沿折痕压在纸面上 -->
    <linearGradient id="crease" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 纸面本体：右上角被切掉，其余三角保留圆角 -->
  <path
    d="M14 6 H28 L42 20 V34 A8 8 0 0 1 34 42 H14 A8 8 0 0 1 6 34 V20 A8 8 0 0 1 14 6 Z"
    fill="url(#page)"
  />

  <!-- 折痕投影：贴在折痕内侧的一道暗带 -->
  <path d="M28 6 L42 20 L33.5 20 Z" fill="url(#crease)" />

  <!-- 折起的小三角：沿折痕 (28,6)-(42,20) 翻折，自由角落在 (28,20) -->
  <path d="M28 6 L28 20 L42 20 Z" fill="url(#fold)" />

  <!-- 折痕高光：一道发丝白线，强调纸的厚度与转折 -->
  <path
    d="M28 6 L42 20"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.85"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <!-- 自由角边缘的极淡描边：让折角与背景分明 -->
  <path
    d="M28 20 L42 20"
    fill="none"
    stroke="#312E81"
    stroke-opacity="0.18"
    stroke-width="0.9"
  />
</svg>
